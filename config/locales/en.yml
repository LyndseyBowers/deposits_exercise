# Error messages are for humans; API clients should branch on the error `code`,
# which stays stable even when a joke gets rewritten. See docs/DECISIONS.md §7.
en:
  activerecord:
    errors:
      models:
        deposit:
          attributes:
            amount:
              blank: "Deposits need an amount. Even Lyndsey's cold brew budget has one."
              not_a_number: "That's not a number. We checked twice."
              greater_than: "Deposits go in, not out. Try a number greater than %{count}."
              exceeds_outstanding_balance: "Whoa there, overachiever. That's more than the %{balance} left on this tradeline."
            deposit_date:
              blank: "Every deposit needs a real date (YYYY-MM-DD). Calendars are hard; we get it."
            tradeline:
              no_amount: "This tradeline has no amount on record, so there's nothing to pay down. Much like the list of reasons not to hire Lyndsey."

  api_errors:
    not_found: "Not found. Like Lyndsey's next job, unless you're reading this, Beyond Finance."
    parameter_missing: "No deposit to be found in that request. Send an amount and a deposit_date and we'll take it from there."
