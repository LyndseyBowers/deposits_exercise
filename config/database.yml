# PostgreSQL. Chosen over SQLite for real row-level locking (SELECT ... FOR UPDATE);
# see docs/DECISIONS.md.
#
# Connects over the local socket as the current OS user by default.
# Override with DATABASE_URL or the PG* environment variables if needed.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: deposits_exercise_development

test:
  <<: *default
  database: deposits_exercise_test

production:
  <<: *default
  database: deposits_exercise_production
  url: <%= ENV["DATABASE_URL"] %>
